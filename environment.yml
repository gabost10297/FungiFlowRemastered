name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - blast      # identify consensus sequences against UNITE
  - kraken2    # classify every individual read against UNITE
  - seqkit     # inspect and filter FASTA/FASTQ files
  - chopper   # trim primers from FASTA/FASTQ files
  - vsearch     # identify consensus sequences against UNITE
  - itsx       # trim consensuses to ITS1-5.8S-ITS2
  - mafft      # align sequences of the same organism, and the representatives
  - iqtree     # build the phylogenetic tree from the aligned representatives